# ─── GRC Command Center — nginx ─────────────────────────────────────────────
# Serves the React SPA and proxies /api/* to the backend container.
# "backend" resolves via Docker Compose internal DNS.

server {
    listen 3006;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend service ──────────────────────────────────────────
    location /api/ {
        proxy_pass          http://backend:8001;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Request-ID      $request_id;

        # Ingestion can take time on first run — give it room
        proxy_connect_timeout  10s;
        proxy_read_timeout    120s;
        proxy_send_timeout     30s;
    }

    # ── SPA fallback — all non-asset routes go to index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"               always;
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-XSS-Protection       "1; mode=block"      always;
    add_header Referrer-Policy        "no-referrer"        always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
