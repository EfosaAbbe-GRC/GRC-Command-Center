# ─── GRC Command Center — Hardened Scaling Architecture (v2) ───────────────────
# Features: PostgreSQL 16, Automated Backups, WebSocket Streams
# Run: docker compose -f docker-compose-v2.yml up --build

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    # Digest-pinned: the exact image running on 2026-10-26.
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: grc-db-pg
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: grc_audit
      # Bootstrap superuser: break-glass only, nothing running connects as it.
      POSTGRES_USER: grc_admin
      POSTGRES_PASSWORD: ${GRC_ADMIN_PG_PASSWORD:?set GRC_ADMIN_PG_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      # Read by docker/db-init/10-roles.sh, which creates the least-privilege roles.
      GRC_OWNER_DB_PASSWORD: ${GRC_OWNER_DB_PASSWORD:?set GRC_OWNER_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      GRC_APP_DB_PASSWORD: ${GRC_APP_DB_PASSWORD:?set GRC_APP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      GRC_BACKUP_DB_PASSWORD: ${GRC_BACKUP_DB_PASSWORD:?set GRC_BACKUP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - grc-db-data:/var/lib/postgresql/data
    networks:
      - grc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_admin -d grc_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Automated Backup Service (GRC Retention) ────────────────────────────────
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine@sha256:08e7b70879af45a89305b91f4600cfbc88da2419a65948df870cddb082b8cf83
    container_name: grc-db-backup
    restart: unless-stopped
    volumes:
      - grc-db-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: grc_audit
      # Read-only role (pg_read_all_data): a backup job has no business writing.
      POSTGRES_USER: grc_backup
      POSTGRES_PASSWORD: ${GRC_BACKUP_DB_PASSWORD:?set GRC_BACKUP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 4
    networks:
      - grc-net

  # ── Backend ─────────────────────────────────────────────────────────────────
  # ── Schema migration (one-shot, as grc_owner) ─────────────────────────────────
  # The only thing that changes the schema. The backend waits for it to exit 0.
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "core.migrate"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MIGRATE_DATABASE_URL=postgresql+asyncpg://grc_owner:${GRC_OWNER_DB_PASSWORD:?set GRC_OWNER_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}@db:5432/grc_audit
      - DOCUMENTS_PATH=/app/GRC_Analyst
    networks:
      - grc-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grc-backend
    restart: unless-stopped
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A reaper as PID 1: uvicorn doesn't collect exited child processes.
    init: true
    depends_on:
      db:
        condition: service_healthy
      # Fail closed: no backend on a failed or skipped migration.
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # grc_app: can add and read evidence, never alter or un-protect it (startup checks this).
      - DATABASE_URL=postgresql+asyncpg://grc_app:${GRC_APP_DB_PASSWORD:?set GRC_APP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}@db:5432/grc_audit
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in the secrets file (COMPOSE_ENV_FILES)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the secrets file (COMPOSE_ENV_FILES)}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      - ANALYST_PASSWORD=${ANALYST_PASSWORD:?set ANALYST_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:?set VIEWER_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      - DOCUMENTS_PATH=/app/GRC_Analyst
      - AUTH_ENABLED=true
    volumes:
      - grc-faiss:/app/faiss_index
      - grc-tprm-evidence:/app/data/tprm_evidence
      - "${DOCUMENTS_PATH}:/app/GRC_Analyst:ro"
    networks:
      - grc-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: grc-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3006"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - grc-net
    healthcheck:
      # 127.0.0.1, not localhost (IPv6 ::1): failed on every probe until 2026-10-26.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3006/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  grc-db-data:
    driver: local
  grc-db-backups:
    driver: local
  grc-faiss:
    driver: local # Adjusted for local deployment sync
  grc-tprm-evidence:
    driver: local

networks:
  grc-net:
    driver: bridge
