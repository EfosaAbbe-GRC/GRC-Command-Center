# ─── GRC Command Center — Isolated Test Stack ──────────────────────────────
# Purpose: smoke_test.py / pytest run against THIS stack, not the dev/dogfooding
# database, so recurring test runs never pollute real usage data again.
# Run:  docker compose -f docker-compose.test.yml up -d --build
# Then: pytest / smoke_test.py with no env var set hit this stack automatically
#       (GRC_TEST_BASE defaults to http://localhost:8002).
# See TPRM_Tier4_TestDataHygiene_refactor.md for the full rationale.
#
# Explicit project name below is required: without it, Compose infers the
# project name from the directory, which collides with docker-compose-v2.yml's
# default project and makes the dev stack's containers look like "orphans" of
# this one -- a real risk if `--remove-orphans` is ever used here.
name: grc-test

services:

  db-test:
    # Digest-pinned: the exact image running on 2026-10-26.
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: grc-db-pg-test
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: grc_audit_test
      # Bootstrap superuser: break-glass only, nothing running connects as it.
      POSTGRES_USER: grc_admin
      POSTGRES_PASSWORD: ${GRC_ADMIN_PG_PASSWORD:?set GRC_ADMIN_PG_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      # Read by docker/db-init/10-roles.sh, which creates the least-privilege roles.
      GRC_OWNER_DB_PASSWORD: ${GRC_OWNER_DB_PASSWORD:?set GRC_OWNER_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      GRC_APP_DB_PASSWORD: ${GRC_APP_DB_PASSWORD:?set GRC_APP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      GRC_BACKUP_DB_PASSWORD: ${GRC_BACKUP_DB_PASSWORD:?set GRC_BACKUP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - grc-db-data-test:/var/lib/postgresql/data
    networks:
      - grc-net-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_admin -d grc_audit_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Schema migration (one-shot, as grc_owner) ─────────────────────────────────
  # The only thing that changes the schema. The backend waits for it to exit 0.
  db-migrate-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "core.migrate"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      disable: true
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      - MIGRATE_DATABASE_URL=postgresql+asyncpg://grc_owner:${GRC_OWNER_DB_PASSWORD:?set GRC_OWNER_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}@db-test:5432/grc_audit_test
      - DOCUMENTS_PATH=/app/GRC_Analyst
    networks:
      - grc-net-test

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grc-backend-test
    restart: unless-stopped
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A reaper as PID 1: uvicorn doesn't collect exited child processes.
    init: true
    depends_on:
      db-test:
        condition: service_healthy
      # Fail closed: no backend on a failed or skipped migration.
      db-migrate-test:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      # grc_app: can add and read evidence, never alter or un-protect it (startup checks this).
      - DATABASE_URL=postgresql+asyncpg://grc_app:${GRC_APP_DB_PASSWORD:?set GRC_APP_DB_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}@db-test:5432/grc_audit_test
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in the secrets file (COMPOSE_ENV_FILES)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the secrets file (COMPOSE_ENV_FILES)}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      - ANALYST_PASSWORD=${ANALYST_PASSWORD:?set ANALYST_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:?set VIEWER_PASSWORD in the secrets file (COMPOSE_ENV_FILES)}
      - DOCUMENTS_PATH=/app/GRC_Analyst
      - AUTH_ENABLED=true
    volumes:
      # Reuses the REAL FAISS index, read-only -- avoids an unnecessary ~11min
      # re-ingest. Nothing in the test suite calls POST /ingest, so RO is safe.
      - grc-faiss:/app/faiss_index:ro
      - grc-tprm-evidence-test:/app/data/tprm_evidence
      - "${DOCUMENTS_PATH}:/app/GRC_Analyst:ro"
    networks:
      - grc-net-test
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  grc-db-data-test:
    driver: local
  grc-tprm-evidence-test:
    driver: local
  grc-faiss:
    external: true
    name: grc_command_center_grc-faiss

networks:
  grc-net-test:
    driver: bridge
