# ─── GRC Command Center — Isolated Test Stack ──────────────────────────────
# Purpose: smoke_test.py / pytest run against THIS stack, not the dev/dogfooding
# database, so recurring test runs never pollute real usage data again.
# Run:  docker compose -f docker-compose.test.yml up -d --build
# Then: pytest / smoke_test.py with no env var set hit this stack automatically
#       (GRC_TEST_BASE defaults to http://localhost:8002).
# See TPRM_Tier4_TestDataHygiene_refactor.md for the full rationale.
#
# Explicit project name below is required: without it, Compose infers the
# project name from the directory, which collides with docker-compose-v2.yml's
# default project and makes the dev stack's containers look like "orphans" of
# this one -- a real risk if `--remove-orphans` is ever used here.
name: grc-test

services:

  db-test:
    # Digest-pinned: the exact image running on 2026-10-26.
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: grc-db-pg-test
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: grc_audit_test
      POSTGRES_USER: ${POSTGRES_USER:-grc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - grc-db-data-test:/var/lib/postgresql/data
    networks:
      - grc-net-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc_admin} -d grc_audit_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grc-backend-test
    restart: unless-stopped
    # Runs as a non-root user and needs no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-grc_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db-test:5432/grc_audit_test
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - ANALYST_PASSWORD=${ANALYST_PASSWORD:?set ANALYST_PASSWORD in .env}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:?set VIEWER_PASSWORD in .env}
      - DOCUMENTS_PATH=/app/GRC_Analyst
      - AUTH_ENABLED=true
    volumes:
      # Reuses the REAL FAISS index, read-only -- avoids an unnecessary ~11min
      # re-ingest. Nothing in the test suite calls POST /ingest, so RO is safe.
      - grc-faiss:/app/faiss_index:ro
      - grc-tprm-evidence-test:/app/data/tprm_evidence
      - "${DOCUMENTS_PATH}:/app/GRC_Analyst:ro"
    networks:
      - grc-net-test
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  grc-db-data-test:
    driver: local
  grc-tprm-evidence-test:
    driver: local
  grc-faiss:
    external: true
    name: grc_command_center_grc-faiss

networks:
  grc-net-test:
    driver: bridge
